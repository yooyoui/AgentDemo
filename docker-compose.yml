services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: visit_assistant
      POSTGRES_USER: visit
      POSTGRES_PASSWORD: visit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visit -d visit_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visit
      MINIO_ROOT_PASSWORD: visit-assistant
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
